name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Godot ${{ matrix.godot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release and the latest one tested.
        godot: ["4.2.2", "4.7.2"]
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}-stable/Godot_v${{ matrix.godot }}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${{ matrix.godot }}-stable_linux.x86_64" godot
          ./godot --version

      - name: Import project
        run: ./godot --headless --editor --path . --quit

      - name: Run tests
        run: ./godot --headless --path . --script tests/run_tests.gd
